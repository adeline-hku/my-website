<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Document Submission</title>
  <style>
    body { font-family: Arial, sans-serif; max-width: 600px; margin: 40px auto; padding: 20px; }
    .form-group { margin-bottom: 20px; }
    label { font-weight: bold; display: block; margin-bottom: 8px; }
    input[type="file"] { padding: 8px; border: 1px solid #ccc; width: 100%; box-sizing: border-box; }
    button { padding: 10px 20px; background: #0078d4; color: white; border: none; border-radius: 4px; cursor: pointer; }
    button:hover { background: #005a9e; }
    #status { margin-top: 15px; font-weight: bold; }
  </style>
</head>
<body>

  <h2>Submit Document to Azure</h2>
  
  <div class="form-group">
    <label for="fileInput">Choose document to upload:</label>
    <input type="file" id="fileInput" />
  </div>

  <button onclick="uploadDocument()">Submit Document</button>

  <div id="status"></div>

  <script>
    // Configuration values
    const STORAGE_ACCOUNT = "YOUR_STORAGE_ACCOUNT_NAME";
    const CONTAINER_NAME = "documents";
    const SAS_TOKEN = "?YOUR_SAS_TOKEN_HERE"; // Must start with '?'

    async function uploadDocument() {
      const fileInput = document.getElementById('fileInput');
      const statusDiv = document.getElementById('status');

      if (!fileInput.files.length) {
        statusDiv.innerText = "Please select a file first.";
        statusDiv.style.color = "red";
        return;
      }

      const file = fileInput.files[0];
      statusDiv.innerText = "Uploading to Azure Storage...";
      statusDiv.style.color = "black";

      // Target URL: https://<account>.blob.core.windows.net/documents/<filename>?<sasToken>
      const uploadUrl = `https://${STORAGE_ACCOUNT}.blob.core.windows.net/${CONTAINER_NAME}/${encodeURIComponent(file.name)}${SAS_TOKEN}`;

      try {
        const response = await fetch(uploadUrl, {
          method: 'PUT',
          headers: {
            'x-ms-blob-type': 'BlockBlob', // Required by Azure REST API
            'Content-Type': file.type || 'application/octet-stream'
          },
          body: file
        });

        if (response.ok) {
          statusDiv.innerText = `Success! "${file.name}" was uploaded.`;
          statusDiv.style.color = "green";
          fileInput.value = ""; 
        } else {
          statusDiv.innerText = `Upload failed (Status: ${response.status}). Check SAS token or CORS settings.`;
          statusDiv.style.color = "red";
        }
      } catch (error) {
        console.error(error);
        statusDiv.innerText = "Error uploading file. Check browser console for details.";
        statusDiv.style.color = "red";
      }
    }
  </script>
</body>
</html>
